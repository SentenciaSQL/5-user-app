<h3>{{ title }}</h3>

<button class="btn btn-primary my-3" [routerLink]="['/users/create']">Create User</button>

@if (users.length === 0) {
  <div class="alert alert-warning" role="alert">
    No hay usuarios registrados
  </div>
} @else {
  <table class="table table-hover table-striped">
    <thead>
    <tr>
      <th>Id</th>
      <th>Name</th>
      <th>Lastname</th>
      <th>Email</th>
      <th>Username</th>
      <th>remove</th>
      <th>update</th>
    </tr>
    </thead>
    <tbody>
      @for (user of users; track $index) {
        <tr>
          <td>{{ user.id }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.lastname }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.username }}</td>
          <td>
            <button
              class="btn btn-danger"
              (click)="onRemoveUser(user.id)">
              Remove
            </button>
          </td>
          <td>
            <button
              class="btn btn-info"
              [routerLink]="['/users/edit', user.id]">
              Update
            </button>
        </tr>
      }
    </tbody>
  </table>
}
